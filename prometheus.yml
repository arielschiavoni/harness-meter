global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Permit late samples within 300 days of the series head. Historical rebuilds are
# written in timestamp order; retention and out-of-order acceptance are separate limits.
# This is a Prometheus 3.x config-file option, not a CLI flag.
storage:
  tsdb:
    out_of_order_time_window: 300d

# No scrape jobs needed — the Harness Meter exporter pushes via remote write.
# remote-write-receiver is enabled via --web.enable-remote-write-receiver in docker-compose.yml.
scrape_configs: []
