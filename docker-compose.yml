services:
  metrics-exporter:
    build: ./metrics
    volumes:
      # Mount only the OpenCode database files, not the whole OpenCode data
      # directory (it also holds auth.json). SQLite WAL mode needs all three
      # files; mounting them separately also avoids virtiofs inode caching
      # issues on macOS/Podman that can hide new data. A missing source file is
      # reported as an error instead of Docker creating an empty directory.
      - type: bind
        source: ${OPENCODE_HOST_DIR:-${HOME}/.local/share/opencode}/opencode.db
        target: /data/opencode/opencode.db
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${OPENCODE_HOST_DIR:-${HOME}/.local/share/opencode}/opencode.db-wal
        target: /data/opencode/opencode.db-wal
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${OPENCODE_HOST_DIR:-${HOME}/.local/share/opencode}/opencode.db-shm
        target: /data/opencode/opencode.db-shm
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${PI_SESSIONS_HOST_DIR:-${HOME}/.pi/agent/sessions}
        target: /data/pi-sessions
        read_only: true
        bind: { create_host_path: false }
      - harness_metrics_state:/state
    environment:
      # Comma-separated list of OpenCode databases; empty disables OpenCode.
      - OPENCODE_DB=/data/opencode/opencode.db
      # Empty disables Pi.
      - PI_SESSIONS_DIR=/data/pi-sessions
      - STATE_DB=/state/metrics-state.db
      - PROMETHEUS_URL=http://prometheus:9090
      - POLL_INTERVAL_MS=60000
      - BATCH_SIZE=500
    depends_on:
      - prometheus
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2y"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - harness_prometheus_data:/prometheus
    ports:
      # Local only: Prometheus has no authentication.
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      # Local, single-user stack: no login. Anonymous visitors get the Admin
      # role so dashboards stay editable; the login form is hidden.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/harness.json
      - GF_DATE_FORMATS_INTERVAL_HOUR=DD/MM HH:mm
      - GF_DATE_FORMATS_INTERVAL_DAY=DD/MM
      - GF_DATE_FORMATS_INTERVAL_MONTH=MM/YYYY
      - GF_DATE_FORMATS_FULL_DATE=DD/MM/YYYY HH:mm:ss
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Local only: anyone who can reach this port is a Grafana admin.
      - "127.0.0.1:3100:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  harness_prometheus_data:
  grafana_data:
  harness_metrics_state:
